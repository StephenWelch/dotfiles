set-window-option -g mode-keys vi

# VIM-like selection
# ------------------
# Use 'v' to begin selection (like visual mode in vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Use 'y' to yank (copy) text
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# UI
#---

# Use 'Ctrl+v' for rectangle-toggle
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Enable extended keys
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Bind "R" to reloading tmux config
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Enable mouse scrolling
set -g mouse

# --- Claude Code friendliness ---
set -g default-terminal "tmux-256color"
# No forced RGB: mosh 1.3.2 mangles 24-bit SGR (dark-on-dark tabs). Without it
# tmux downsamples the hex colors below to the 256-color palette.
set -sg escape-time 0
set -g set-clipboard on
set -g focus-events on

# Highlight windows that produce activity / bells while you're elsewhere —
# pairs with the Claude Stop hook that runs `tmux display-message`.
set -g monitor-activity on
set -g visual-activity off
set -g monitor-bell on
set -g visual-bell off
set -g bell-action any

# --- Status bar — compact, subdued (Catppuccin Mocha palette) ---
set -g status-position bottom
set -g status-interval 30
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 30
set -g status-right-length 50

# Left: just session name, subtle accent.
set -g status-left  "#[fg=#89b4fa,bold] #S #[fg=#45475a]│ "

# Window list: current window highlighted, no brackets/asterisks.
set -g window-status-style          "fg=#6c7086"
set -g window-status-format         " #I·#W "
set -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #I·#W "
set -g window-status-separator      ""

# Background-activity / bell flags: subtle tint instead of default reverse-video.
set -g window-status-activity-style "bg=#313244,fg=#f9e2af"
set -g window-status-bell-style     "bg=#f38ba8,fg=#1e1e2e,bold"

# Right: 20-char pane title.
set -g status-right "#[fg=#45475a]│ #[fg=#a6e3a1]#{=20:pane_title} "

# Pane borders — dim inactive, accent the active one.
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message / command-prompt line.
set -g message-style "bg=#1e1e2e,fg=#f9e2af"
